- name: Initialize the committer state database with the committer container
  vars:
    container_name: "{{ committer_container_name }}-db-init"
    container_image: "{{ committer_image }}"
    container_command: >-
      init-db
      --config={{ committer_container_config_dir }}/{{ committer_config_file }}
      --timeout={{ committer_db_init_timeout }}
    container_volumes:
      - "{{ committer_remote_config_dir }}:{{ committer_container_config_dir }}:z,ro"
    # Run to completion and clean up: this is a one-shot administrative command, not a service.
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
