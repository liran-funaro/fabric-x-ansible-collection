- name: Remove Yugabyte DB Kubernetes resources
  ansible.builtin.include_role:
    name: hyperledger.fabricx.yugabyte
    tasks_from: k8s/rm
  when: yugabyte_use_k8s

- name: Teardown Yugabyte on OpenShift
  ansible.builtin.include_role:
    name: hyperledger.fabricx.yugabyte
    tasks_from: openshift/rm
  when: yugabyte_use_openshift

- name: Remove the Yugabyte DB containers
  ansible.builtin.include_role:
    name: hyperledger.fabricx.yugabyte
    tasks_from: container/rm
  when: yugabyte_use_container

- name: Stop the Yugabyte DB binaries
  # The unpacked release is deliberately left in place, the same way container mode leaves
  # the image behind: only the process and its data go.
  ansible.builtin.include_role:
    name: hyperledger.fabricx.yugabyte
    tasks_from: bin/stop
  when: yugabyte_use_bin

- name: Remove Yugabyte DB data
  ansible.builtin.include_role:
    name: hyperledger.fabricx.yugabyte
    tasks_from: data/rm
