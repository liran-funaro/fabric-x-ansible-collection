- name: Initialize SAN entries
  vars:
    ansible_host_is_ip: "{{ ansible_host is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$') }}"
    san_prefix: >-
      {{
        'IP.0'
        if ansible_host_is_ip
        else 'DNS.0'
      }}
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries:
      - "{{ san_prefix }}:{{ ansible_host }}"
  when:
    - yugabyte_use_tls

# If we run Yugabyte on macOS, it will try to bind to `host.docker.internal`.
# This patch is needed until this issue is fixed:
# https://github.com/yugabyte/yugabyte-db/issues/29453
- name: Add host.docker.internal IP resolution as SAN entry
  vars:
    host_docker_internal_san_entry: "IP.0:192.168.127.254"
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + [host_docker_internal_san_entry] }}"
  when:
    - ansible_facts.os_family == 'Darwin'

# Note: we add all IP addresses to the SAN entries, but technically
# we should only add the public ones that will be used to reach
# the node.
- name: Add IP addresses to SAN entries
  vars:
    current_san_ip_entry: "IP.{{ item_index + 1 }}:{{ current_ip_addr }}"
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + [current_san_ip_entry] }}"
  loop: "{{ ansible_all_ipv4_addresses }}"
  loop_control:
    loop_var: current_ip_addr
    index_var: item_index
    label: "{{ current_ip_addr }}"
  when:
    - yugabyte_use_tls
    - ansible_all_ipv4_addresses is defined
    - ansible_all_ipv4_addresses
      | length > 0

- name: Add every cluster node's address to SAN entries
  # A YugabyteDB smart driver with load_balance=true discovers the other nodes through
  # yb_servers() and moves connections onto them, but it rewrites only the host, port and
  # fallback list on the connection config -- not TLSConfig.ServerName. Under
  # sslmode=verify-full the peer's certificate is then checked against the address of the
  # endpoint originally dialled, and fails:
  #
  #   x509: certificate is valid for 10.241.64.14, not 10.241.64.10
  #
  # Every discovered node is marked unavailable and the client silently keeps all its
  # connections on its first endpoint, capping the cluster at one node's SQL front end.
  # Naming all cluster addresses in each node's certificate makes verification succeed
  # whichever node the balancer lands on.
  #
  # The nodes of one cluster already share a CA and are mutually trusted peers, so this does
  # not widen the trust boundary beyond the cluster. It does let any node within it present
  # itself as any other, which is why it is opt-in.
  vars:
    current_san_entry: "IP.{{ yugabyte_openssl_san_entries | length }}:{{ current_cluster_host_ip }}"
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + [current_san_entry] }}"
  loop: >-
    {{
      yugabyte_cluster
      | map('extract', hostvars, 'ansible_host')
      | unique
      | list
    }}
  loop_control:
    loop_var: current_cluster_host_ip
    label: "{{ current_cluster_host_ip }}"
  when:
    - yugabyte_use_tls
    - yugabyte_tls_san_all_cluster_nodes
    - yugabyte_cluster is defined

- name: Add Yugabyte OpenShift master webserver route to SAN entries
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + ['DNS:' + yugabyte_openshift_master_webserver_route] }}"
  when:
    - yugabyte_component_type == 'master'
    - yugabyte_openshift_master_webserver_route is defined

- name: Add Yugabyte OpenShift tablet webserver route to SAN entries
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + ['DNS:' + yugabyte_openshift_tablet_webserver_route] }}"
  when:
    - yugabyte_component_type == 'tablet'
    - yugabyte_openshift_tablet_webserver_route is defined

- name: Add Yugabyte OpenShift tablet pgsql web route to SAN entries
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + ['DNS:' + yugabyte_openshift_tablet_pgsql_web_route] }}"
  when:
    - yugabyte_component_type == 'tablet'
    - yugabyte_openshift_tablet_pgsql_web_route is defined

- name: Add Yugabyte OpenShift tablet cql web route to SAN entries
  ansible.builtin.set_fact:
    yugabyte_openssl_san_entries: "{{ yugabyte_openssl_san_entries + ['DNS:' + yugabyte_openshift_tablet_cql_web_route] }}"
  when:
    - yugabyte_component_type == 'tablet'
    - yugabyte_openshift_tablet_cql_web_route is defined

- name: Generate CSR for TLS cert
  vars:
    openssl_common_name: "{{ inventory_hostname }}"
    openssl_organization: "{{ organization.domain }}"
    openssl_private_key_path: "{{ yugabyte_remote_config_dir }}/tls/node.{{ ansible_host }}.key"
    openssl_csr_path: "{{ yugabyte_remote_config_dir }}/tls/tls.csr"
    openssl_ext_file_path: "{{ yugabyte_remote_config_dir }}/tls/tls.ext"
    openssl_san_entries: "{{ yugabyte_openssl_san_entries }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.openssl
    tasks_from: generate_csr
  when:
    - yugabyte_use_tls
