# YugabyteDB ships a prebuilt release archive rather than something the shared bin role can
# build, so this installs from that archive instead of going through hyperledger.fabricx.bin.
#
# The archive is fetched once onto the control node and unpacked from there onto every
# database host. That ordering is deliberate: it keeps a single download per run, and it is
# the only arrangement that works when the database hosts have no route to the internet,
# which is the normal case for an isolated cluster network.

- name: Ensure the locale YugabyteDB's initdb requires is installed
  # A tablet server runs initdb at first start, and initdb refuses to proceed without the
  # locale YugabyteDB asks it for:
  #
  #   In YugabyteDB, setting LC_COLLATE to C and all other locale settings to en_US.UTF-8
  #   initdb: error: invalid locale name "en_US.UTF-8"
  #
  # The name is fixed inside YugabyteDB, so the host has to provide that exact locale. The
  # container image ships it, which is why only binary mode needs this: a minimal RHEL image
  # carries C.utf8 alone and the tablet server dies seconds after it starts.
  ansible.builtin.package:
    name: "{{ yugabyte_locale_packages }}"
    state: present
  become: true

- name: Confirm the locale is now available
  # Installing a package is not the same as having the locale, and the failure it prevents is
  # a fatal crash inside a detached tmux session with the explanation suppressed by
  # yugabyte_logs_level. Fail here, where the message is visible and actionable, instead.
  ansible.builtin.command: locale -a
  register: yugabyte_available_locales
  changed_when: false
  failed_when: >-
    yugabyte_available_locales.stdout_lines
    | map('lower')
    | map('replace', '-', '')
    | select('search', '^en_us.utf8$')
    | list
    | length == 0

- name: Ensure the control node release directory exists
  ansible.builtin.file:
    path: "{{ yugabyte_control_release_dir }}"
    state: directory
    mode: "0o755"
  delegate_to: localhost
  run_once: true

- name: Download the YugabyteDB release archive to the control node
  ansible.builtin.get_url:
    url: "{{ yugabyte_release_url }}"
    dest: "{{ yugabyte_control_release_archive }}"
    mode: "0o644"
  delegate_to: localhost
  run_once: true

- name: Ensure the YugabyteDB install directory exists
  ansible.builtin.file:
    path: "{{ yugabyte_install_dir }}"
    state: directory
    mode: "0o755"

- name: Unpack the YugabyteDB release
  ansible.builtin.unarchive:
    src: "{{ yugabyte_control_release_archive }}"
    dest: "{{ yugabyte_install_dir }}"
    # The archive contains a single yugabyte-<version> directory, so this doubles as the
    # idempotence guard: an already unpacked release is left alone.
    creates: "{{ yugabyte_home_dir }}/bin/yb-master"
    extra_opts:
      - --no-same-owner

- name: Patch the YugabyteDB library paths
  # The release archive is linked against libraries at paths that only exist inside
  # Yugabyte's own build image. post_install.sh rewrites those to point inside the unpacked
  # tree, and yb-master and yb-tserver do not start without it. It is safe to re-run, but
  # the marker keeps it out of the change count once done.
  ansible.builtin.command: "{{ yugabyte_home_dir }}/bin/post_install.sh"
  args:
    chdir: "{{ yugabyte_home_dir }}"
    creates: "{{ yugabyte_home_dir }}/.post_install.done"

- name: Mark the library paths as patched
  ansible.builtin.file:
    path: "{{ yugabyte_home_dir }}/.post_install.done"
    state: touch
    mode: "0o644"
    modification_time: preserve
    access_time: preserve
