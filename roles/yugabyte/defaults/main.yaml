---

# Automatically generated by aar-doc. DO NOT EDIT MANUALLY.

# Names every cluster node's address in each node's TLS certificate, rather than only the node's own addresses.
# Needed for a smart-driver client using C(load_balance=true) with C(sslmode=verify-full). The driver moves a connection to a discovered node without updating the TLS server name it verifies against, so the peer's certificate is checked against the address of the endpoint first dialled and fails; the client then keeps every connection on that one endpoint and the cluster is capped at a single node's SQL front end.
# The nodes of a cluster already share a CA and are mutually trusted peers, so this does not widen the trust boundary beyond the cluster, but it does let any node in it present itself as any other.
yugabyte_tls_san_all_cluster_nodes: false
# Enables Kubernetes mode for the YugabyteDB role.
yugabyte_use_k8s: false
# Enables binary mode for the YugabyteDB role, unpacking the release archive on the host and running yb-master or yb-tserver directly under tmux.
# Unlike the Fabric-X components, YugabyteDB is not built from source. The archive is downloaded once onto the control node and unpacked from there onto each database host, so the database hosts themselves need no route to the internet.
yugabyte_use_bin: false
# Enables container mode for the YugabyteDB role.
yugabyte_use_container: '{{ (not yugabyte_use_bin) and (not yugabyte_use_k8s) and (not yugabyte_use_openshift) }}'
# Names the tmux session and log file used by the YugabyteDB binary on this host.
yugabyte_bin_name: '{{ inventory_hostname }}'
# Lists the packages that provide the C(en_US.UTF-8) locale in binary mode.
# YugabyteDB asks initdb for that locale by name, so a host without it cannot start a tablet server at all. Container mode is unaffected because the image ships it.
# The default covers the RedHat family, where the locale arrives ready to use. On Debian and Ubuntu, installing C(locales) is not by itself enough; the locale also has to be generated, so add that step or preseed the image.
yugabyte_locale_packages:
  - "{{ 'glibc-langpack-en' if ansible_facts['os_family'] == 'RedHat' else 'locales' }}"
# Selects the YugabyteDB release used in binary mode.
# Defaults to O(yugabyte_image_tag) so that binary and container mode run the same version unless one is set deliberately.
yugabyte_release_version: '{{ yugabyte_image_tag }}'
# Strips the build suffix from O(yugabyte_release_version).
# YugabyteDB uses both forms. The archive filename carries the full build, while the download path and the directory inside the archive use the version alone, so C(2025.2.1.0-b141) is published at C(releases/2025.2.1.0/) and unpacks into C(yugabyte-2025.2.1.0).
yugabyte_release_base_version: "{{ yugabyte_release_version | regex_replace('-b[0-9]+$', '') }}"
# Names the YugabyteDB release archive to download.
yugabyte_release_archive: yugabyte-{{ yugabyte_release_version }}-linux-x86_64.tar.gz
# Sets the URL the release archive is downloaded from.
yugabyte_release_url: "https://software.yugabyte.com/releases/{{ yugabyte_release_base_version }}/{{ yugabyte_release_archive }}"
# Sets the control node directory holding the downloaded release archive.
yugabyte_control_release_dir: '{{ control_node_dir }}/yugabyte'
# Sets the control node path of the downloaded release archive.
yugabyte_control_release_archive: '{{ yugabyte_control_release_dir }}/{{ yugabyte_release_archive }}'
# Sets the host directory the release archive is unpacked into.
# Point this at a data disk. The unpacked release is a few GB, which is more than a small root filesystem can usually spare.
# Keyed on O(remote_deploy_dir) rather than the per-host C(remote_node_dir), because it has to resolve to the same absolute path on every node. A master bootstrapping the cluster replicates the path of its initial system catalog snapshot through Raft, so a follower whose release sits elsewhere cannot find that snapshot and aborts. Sharing the path also means one copy of the release per machine rather than one per node.
yugabyte_install_dir: '{{ remote_deploy_dir }}/yugabyte'
# Sets the unpacked release directory holding C(bin/yb-master) and C(bin/yb-tserver).
# Named after O(yugabyte_release_base_version), because that is what the archive unpacks into: the build suffix appears in the filename but not in the directory.
yugabyte_home_dir: '{{ yugabyte_install_dir }}/yugabyte-{{ yugabyte_release_base_version }}'
# Lists the data directories a master uses in binary mode.
# A master holds only cluster metadata, so one directory is normally enough.
yugabyte_master_data_dirs:
  - '{{ yugabyte_remote_data_dir }}'
# Lists the data directories a tablet server uses in binary mode.
# Give it one directory per physical disk. A tablet server spreads its tablets over the directories it is given and reads and writes them in parallel, which a single directory cannot do however fast the disk behind it is.
yugabyte_tablet_data_dirs:
  - '{{ yugabyte_remote_data_dir }}'
# Appends extra command line flags to yb-master in binary mode.
yugabyte_master_extra_flags: []
# Appends extra command line flags to yb-tserver in binary mode.
yugabyte_tablet_extra_flags: []
# Seconds any single yb-admin readiness call may take before it is abandoned.
# yb-admin blocks inside its client setup when the masters are not answering, so it has to be bounded for the surrounding retry loop to make progress rather than spending its whole budget on one hang.
yugabyte_bin_admin_timeout: 15
# Whether a tablet server advertises its OS hostname, rather than its address, as its own location.
# This is what C(yb_servers()) reports, and C(yb_servers()) is how a YugabyteDB smart driver client with C(load_balance=true) discovers the nodes to spread its connections over. On bare machines the OS hostname usually resolves nowhere outside the machine itself, and the generated node certificates carry only IP SANs, so an advertised hostname is unusable twice over: the client cannot resolve it, and could not verify it under C(sslmode=verify-full) if it could. A client that cannot use any discovered node silently keeps every connection on its first endpoint, which caps the whole cluster's throughput at one node and exhausts that node's connection slots.
# Container and Kubernetes deployments advertise the hostname unconditionally, because there the hostname is the resolvable service name.
yugabyte_bin_use_node_hostname: false
# Seconds to wait for a YugabyteDB binary to start serving on its port.
# A tablet server has to reach the masters and be assigned tablets before it accepts SQL, which on a cold cluster takes appreciably longer than a process start.
yugabyte_bin_wait_timeout: 300
# Enables TLS asset handling for YugabyteDB.
yugabyte_use_tls: false
# Enables HTTPS for the YugabyteDB webserver.
yugabyte_webserver_use_tls: '{{ yugabyte_use_tls }}'
# Enables client-to-server TLS for YugabyteDB RPC and SQL access.
yugabyte_client_to_server_use_tls: '{{ yugabyte_use_tls }}'
# Enables node-to-node TLS for YugabyteDB.
yugabyte_node_to_node_use_tls: '{{ yugabyte_use_tls }}'
# Sets the registry endpoint used to resolve the YugabyteDB image.
yugabyte_registry_endpoint: "{{ lookup('env', 'YUGABYTE_REGISTRY_ENDPOINT') or 'docker.io/yugabytedb' }}"
# Sets the YugabyteDB image name.
yugabyte_image_name: yugabyte
# Sets the YugabyteDB image tag.
yugabyte_image_tag: 2025.2.1.0-b141
# Sets the YugabyteDB container image.
yugabyte_image: "{{ yugabyte_registry_endpoint }}/{{ yugabyte_image_name }}:{{ yugabyte_image_tag }}"
# Names the YugabyteDB container associated with the current host.
yugabyte_container_name: '{{ inventory_hostname }}'
# Sets the remote configuration directory used by YugabyteDB tasks.
yugabyte_remote_config_dir: '{{ remote_config_dir }}'
# Sets the remote data directory used by YugabyteDB tasks.
yugabyte_remote_data_dir: '{{ remote_data_dir }}'
# Sets the in-container data directory used by YugabyteDB.
yugabyte_container_data_dir: /var/data
# Names the SQL initialization script used by tablet pods.
yugabyte_init_script_file: 01-yb-init.sql
# Sets the YugabyteDB log verbosity threshold.
yugabyte_logs_level: 3
# Sets the master RPC bind port.
yugabyte_master_rpc_bind_port: 7100
# Sets the master webserver port.
yugabyte_master_webserver_port: 7000
# Sets the tablet YSQL bind port.
yugabyte_tablet_pgsql_bind_port: 5433
# Sets the tablet RPC bind port.
yugabyte_tablet_rpc_bind_port: 9100
# Sets the tablet webserver port.
yugabyte_tablet_webserver_port: 9000
# Sets the tablet YSQL web UI port.
yugabyte_tablet_pgsql_web_port: 13000
# Sets the tablet YCQL bind port.
yugabyte_tablet_cql_bind_port: 9042
# Sets the tablet YCQL web UI port.
yugabyte_tablet_cql_web_port: 12000
# Names the Kubernetes resources associated with the current host, including the derived NodePort Service when enabled.
yugabyte_k8s_resource_name: '{{ inventory_hostname }}'
# Value for the Kubernetes C(app.kubernetes.io/part-of) label applied to YugabyteDB resources.
yugabyte_k8s_part_of: yugabyte
# Waits for YugabyteDB Kubernetes resources to become ready.
yugabyte_k8s_wait: true
# Sets the Kubernetes readiness wait timeout in seconds.
yugabyte_k8s_wait_timeout: 300
# Set to C(true) to create a LoadBalancer Service entry that exposes the master RPC port externally.
# When undefined or C(false), the master RPC port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_master_rpc_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the master webserver port externally.
# When undefined or C(false), the master webserver port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_master_webserver_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YSQL port externally.
# When undefined or C(false), the tablet YSQL port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_pgsql_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet RPC port externally.
# When undefined or C(false), the tablet RPC port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_rpc_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet webserver port externally.
# When undefined or C(false), the tablet webserver port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_webserver_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YSQL web UI port externally.
# When undefined or C(false), the tablet YSQL web UI port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_pgsql_web_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YCQL bind port externally.
# When undefined or C(false), the tablet YCQL bind port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_cql_bind_port: false
# Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YCQL web UI port externally.
# When undefined or C(false), the tablet YCQL web UI port is not included in the LoadBalancer Service.
yugabyte_k8s_loadbalancer_expose_tablet_cql_web_port: false
# Selects the OpenShift deployment branch.
yugabyte_use_openshift: false
