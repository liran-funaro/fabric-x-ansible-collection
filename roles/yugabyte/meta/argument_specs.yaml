---
argument_specs:
  role-options:
    short_description: Shared YugabyteDB argument definitions
    description:
      - "Reusable option catalog for the YugabyteDB role."
    options:
      yugabyte_cluster: &yugabyte_cluster
        type: list
        elements: str
        required: true
        description:
          - "Lists the inventory hosts that belong to the YugabyteDB cluster."
          - "Example: C(['yb-master-1', 'yb-master-2', 'yb-master-3', 'yb-tserver-1', 'yb-tserver-2', 'yb-tserver-3'])."
      yugabyte_tls_san_all_cluster_nodes: &yugabyte_tls_san_all_cluster_nodes
        type: bool
        default: false
        description:
          - Names every cluster node's address in each node's TLS certificate, rather than
            only the node's own addresses.
          - Needed for a smart-driver client using C(load_balance=true) with
            C(sslmode=verify-full). The driver moves a connection to a discovered node
            without updating the TLS server name it verifies against, so the peer's
            certificate is checked against the address of the endpoint first dialled and
            fails; the client then keeps every connection on that one endpoint and the
            cluster is capped at a single node's SQL front end.
          - The nodes of a cluster already share a CA and are mutually trusted peers, so this
            does not widen the trust boundary beyond the cluster, but it does let any node in
            it present itself as any other.
      yugabyte_cluster_id: &yugabyte_cluster_id
        type: str
        description:
          - Identifies which YugabyteDB cluster a node belongs to, so nodes of the same cluster
            can find each other from the inventory alone.
          - Unlike C(yugabyte_cluster) this is set on the host rather than passed to an entry
            point, so it is available during crypto setup as well as at start.
          - "Example: C(1)."
      yugabyte_hosts: &yugabyte_hosts
        type: list
        elements: str
        required: true
        description:
          - "Lists the inventory hosts that belong to the YugabyteDB clusters monitored by Prometheus."
          - "Example: C(['yb-master-1', 'yb-master-2', 'yb-master-3', 'yb-tserver-1', 'yb-tserver-2', 'yb-tserver-3'])."
      yugabyte_component_type: &yugabyte_component_type
        type: str
        required: true
        choices:
          - master
          - tablet
        description:
          - "Selects whether the current host is handled as a YugabyteDB master or tablet node."
          - "Example: C(tablet)."
      yugabyte_use_k8s: &yugabyte_use_k8s
        type: bool
        default: false
        description:
          - "Enables Kubernetes mode for the YugabyteDB role."
      yugabyte_use_bin: &yugabyte_use_bin
        type: bool
        default: false
        description:
          - "Enables binary mode for the YugabyteDB role, unpacking the release archive on the
            host and running yb-master or yb-tserver directly under tmux."
          - Unlike the Fabric-X components, YugabyteDB is not built from source. The archive is
            downloaded once onto the control node and unpacked from there onto each database
            host, so the database hosts themselves need no route to the internet.
      yugabyte_use_container: &yugabyte_use_container
        type: bool
        default: "{{ (not yugabyte_use_bin) and (not yugabyte_use_k8s) and (not yugabyte_use_openshift) }}"
        description:
          - "Enables container mode for the YugabyteDB role."
      yugabyte_bin_name: &yugabyte_bin_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - Names the tmux session and log file used by the YugabyteDB binary on this host.
      yugabyte_locale_packages: &yugabyte_locale_packages
        type: list
        elements: str
        default:
          - "{{ 'glibc-langpack-en' if ansible_facts['os_family'] == 'RedHat' else 'locales' }}"
        description:
          - Lists the packages that provide the C(en_US.UTF-8) locale in binary mode.
          - YugabyteDB asks initdb for that locale by name, so a host without it cannot start a
            tablet server at all. Container mode is unaffected because the image ships it.
          - The default covers the RedHat family, where the locale arrives ready to use. On
            Debian and Ubuntu, installing C(locales) is not by itself enough; the locale also
            has to be generated, so add that step or preseed the image.
      yugabyte_release_version: &yugabyte_release_version
        type: str
        default: "{{ yugabyte_image_tag }}"
        description:
          - Selects the YugabyteDB release used in binary mode.
          - Defaults to O(yugabyte_image_tag) so that binary and container mode run the same
            version unless one is set deliberately.
      yugabyte_release_base_version: &yugabyte_release_base_version
        type: str
        default: "{{ yugabyte_release_version | regex_replace('-b[0-9]+$', '') }}"
        description:
          - Strips the build suffix from O(yugabyte_release_version).
          - YugabyteDB uses both forms. The archive filename carries the full build, while the
            download path and the directory inside the archive use the version alone, so
            C(2025.2.1.0-b141) is published at C(releases/2025.2.1.0/) and unpacks into
            C(yugabyte-2025.2.1.0).
      yugabyte_release_archive: &yugabyte_release_archive
        type: str
        default: "yugabyte-{{ yugabyte_release_version }}-linux-x86_64.tar.gz"
        description:
          - Names the YugabyteDB release archive to download.
      yugabyte_release_url: &yugabyte_release_url
        type: str
        default: "https://software.yugabyte.com/releases/{{ yugabyte_release_base_version }}/{{ yugabyte_release_archive }}"
        description:
          - Sets the URL the release archive is downloaded from.
      yugabyte_control_release_dir: &yugabyte_control_release_dir
        type: path
        default: "{{ control_node_dir }}/yugabyte"
        description:
          - Sets the control node directory holding the downloaded release archive.
      yugabyte_control_release_archive: &yugabyte_control_release_archive
        type: path
        default: "{{ yugabyte_control_release_dir }}/{{ yugabyte_release_archive }}"
        description:
          - Sets the control node path of the downloaded release archive.
      yugabyte_install_dir: &yugabyte_install_dir
        type: path
        default: "{{ remote_deploy_dir }}/yugabyte"
        description:
          - Sets the host directory the release archive is unpacked into.
          - Point this at a data disk. The unpacked release is a few GB, which is more than a
            small root filesystem can usually spare.
          - Keyed on O(remote_deploy_dir) rather than the per-host C(remote_node_dir), because
            it has to resolve to the same absolute path on every node. A master bootstrapping
            the cluster replicates the path of its initial system catalog snapshot through
            Raft, so a follower whose release sits elsewhere cannot find that snapshot and
            aborts. Sharing the path also means one copy of the release per machine rather
            than one per node.
      yugabyte_home_dir: &yugabyte_home_dir
        type: path
        default: "{{ yugabyte_install_dir }}/yugabyte-{{ yugabyte_release_base_version }}"
        description:
          - Sets the unpacked release directory holding C(bin/yb-master) and C(bin/yb-tserver).
          - "Named after O(yugabyte_release_base_version), because that is what the archive
            unpacks into: the build suffix appears in the filename but not in the directory."
      yugabyte_master_data_dirs: &yugabyte_master_data_dirs
        type: list
        elements: path
        default:
          - "{{ yugabyte_remote_data_dir }}"
        description:
          - Lists the data directories a master uses in binary mode.
          - A master holds only cluster metadata, so one directory is normally enough.
          - "Example: C(['/data1/yb-master'])."
      yugabyte_tablet_data_dirs: &yugabyte_tablet_data_dirs
        type: list
        elements: path
        default:
          - "{{ yugabyte_remote_data_dir }}"
        description:
          - Lists the data directories a tablet server uses in binary mode.
          - Give it one directory per physical disk. A tablet server spreads its tablets over
            the directories it is given and reads and writes them in parallel, which a single
            directory cannot do however fast the disk behind it is.
          - "Example: C(['/data1/yb-tserver', '/data2/yb-tserver'])."
      yugabyte_master_extra_flags: &yugabyte_master_extra_flags
        type: list
        elements: str
        default: []
        description:
          - Appends extra command line flags to yb-master in binary mode.
          - "Example: C(['--ysql_num_shards_per_tserver=4'])."
      yugabyte_tablet_extra_flags: &yugabyte_tablet_extra_flags
        type: list
        elements: str
        default: []
        description:
          - Appends extra command line flags to yb-tserver in binary mode.
          - "Example: C(['--ysql_max_connections=600'])."
      yugabyte_bin_admin_timeout: &yugabyte_bin_admin_timeout
        type: int
        default: 15
        description:
          - Seconds any single yb-admin readiness call may take before it is abandoned.
          - yb-admin blocks inside its client setup when the masters are not answering, so it
            has to be bounded for the surrounding retry loop to make progress rather than
            spending its whole budget on one hang.
      yugabyte_bin_use_node_hostname: &yugabyte_bin_use_node_hostname
        type: bool
        default: false
        description:
          - Whether a tablet server advertises its OS hostname, rather than its address, as its
            own location.
          - >-
            This is what C(yb_servers()) reports, and C(yb_servers()) is how a YugabyteDB smart
            driver client with C(load_balance=true) discovers the nodes to spread its connections
            over. On bare machines the OS hostname usually resolves nowhere outside the machine
            itself, and the generated node certificates carry only IP SANs, so an advertised
            hostname is unusable twice over: the client cannot resolve it, and could not verify
            it under C(sslmode=verify-full) if it could. A client that cannot use any discovered
            node silently keeps every connection on its first endpoint, which caps the whole
            cluster's throughput at one node and exhausts that node's connection slots.
          - Container and Kubernetes deployments advertise the hostname unconditionally, because
            there the hostname is the resolvable service name.
      yugabyte_bin_wait_timeout: &yugabyte_bin_wait_timeout
        type: int
        default: 300
        description:
          - Seconds to wait for a YugabyteDB binary to start serving on its port.
          - A tablet server has to reach the masters and be assigned tablets before it accepts
            SQL, which on a cold cluster takes appreciably longer than a process start.
      yugabyte_use_tls: &yugabyte_use_tls
        type: bool
        default: false
        description:
          - "Enables TLS asset handling for YugabyteDB."
      yugabyte_webserver_use_tls: &yugabyte_webserver_use_tls
        type: bool
        default: "{{ yugabyte_use_tls }}"
        description:
          - "Enables HTTPS for the YugabyteDB webserver."
      yugabyte_client_to_server_use_tls: &yugabyte_client_to_server_use_tls
        type: bool
        default: "{{ yugabyte_use_tls }}"
        description:
          - "Enables client-to-server TLS for YugabyteDB RPC and SQL access."
      yugabyte_node_to_node_use_tls: &yugabyte_node_to_node_use_tls
        type: bool
        default: "{{ yugabyte_use_tls }}"
        description:
          - "Enables node-to-node TLS for YugabyteDB."
      yugabyte_registry_endpoint: &yugabyte_registry_endpoint
        type: str
        default: "{{ lookup('env', 'YUGABYTE_REGISTRY_ENDPOINT') or 'docker.io/yugabytedb' }}"
        description:
          - "Sets the registry endpoint used to resolve the YugabyteDB image."
      yugabyte_image_name: &yugabyte_image_name
        type: str
        default: "yugabyte"
        description:
          - "Sets the YugabyteDB image name."
      yugabyte_image_tag: &yugabyte_image_tag
        type: str
        default: "2025.2.1.0-b141"
        description:
          - "Sets the YugabyteDB image tag."
      yugabyte_image: &yugabyte_image
        type: str
        default: "{{ yugabyte_registry_endpoint }}/{{ yugabyte_image_name }}:{{ yugabyte_image_tag }}"
        description:
          - "Sets the YugabyteDB container image."
      yugabyte_container_name: &yugabyte_container_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - "Names the YugabyteDB container associated with the current host."
      yugabyte_remote_config_dir: &yugabyte_remote_config_dir
        type: path
        default: "{{ remote_config_dir }}"
        description:
          - "Sets the remote configuration directory used by YugabyteDB tasks."
      remote_config_dir: &remote_config_dir
        type: path
        description:
          - "Sets the shared remote configuration directory consumed by YugabyteDB."
          - "Example: C(/opt/hyperledger/fabric-x/yugabyte/config)."
      yugabyte_remote_data_dir: &yugabyte_remote_data_dir
        type: path
        default: "{{ remote_data_dir }}"
        description:
          - "Sets the remote data directory used by YugabyteDB tasks."
      remote_data_dir: &remote_data_dir
        type: path
        description:
          - "Sets the shared remote data directory consumed by YugabyteDB."
          - "Example: C(/var/hyperledger/fabric-x/yugabyte/data)."
      remote_deploy_dir: &remote_deploy_dir
        type: path
        description:
          - "Sets the base remote deployment directory that feeds C(yugabyte_install_dir)."
          - "Shared by every node on a machine, and identical across machines."
          - "Example: C(/data1/fabric-x)."
      control_node_dir: &control_node_dir
        type: path
        description:
          - "Sets the control node working directory that feeds C(yugabyte_control_release_dir)."
          - "Example: C(./out/control-node)."
      yugabyte_container_data_dir: &yugabyte_container_data_dir
        type: path
        default: "/var/data"
        description:
          - "Sets the in-container data directory used by YugabyteDB."
      yugabyte_init_script_file: &yugabyte_init_script_file
        type: str
        default: "01-yb-init.sql"
        description:
          - "Names the SQL initialization script used by tablet pods."
      yugabyte_logs_level: &yugabyte_logs_level
        type: int
        default: 3
        description:
          - "Sets the YugabyteDB log verbosity threshold."
      yugabyte_master_endpoints: &yugabyte_master_endpoints
        type: str
        required: true
        description:
          - "Lists the master RPC endpoints used to bootstrap YugabyteDB tablets and health checks."
          - "Example: C(yb-master-1.example.com:7100,yb-master-2.example.com:7100,yb-master-3.example.com:7100)."
      yugabyte_master_hosts: &yugabyte_master_hosts
        type: list
        elements: str
        required: true
        description:
          - "Provides the ordered list of master hosts used to compute replication factors."
          - "Example: C(['yb-master-1', 'yb-master-2', 'yb-master-3'])."
      yugabyte_tablet_hosts: &yugabyte_tablet_hosts
        type: list
        elements: str
        required: true
        description:
          - "Provides the ordered list of tablet hosts used to initialize the first tablet."
          - "Example: C(['yb-tserver-1', 'yb-tserver-2', 'yb-tserver-3'])."
      yugabyte_master_rpc_bind_port: &yugabyte_master_rpc_bind_port
        type: int
        default: 7100
        description:
          - "Sets the master RPC bind port."
      yugabyte_master_webserver_port: &yugabyte_master_webserver_port
        type: int
        default: 7000
        description:
          - "Sets the master webserver port."
      yugabyte_tablet_pgsql_bind_port: &yugabyte_tablet_pgsql_bind_port
        type: int
        default: 5433
        description:
          - "Sets the tablet YSQL bind port."
      yugabyte_tablet_rpc_bind_port: &yugabyte_tablet_rpc_bind_port
        type: int
        default: 9100
        description:
          - "Sets the tablet RPC bind port."
      yugabyte_tablet_webserver_port: &yugabyte_tablet_webserver_port
        type: int
        default: 9000
        description:
          - "Sets the tablet webserver port."
      yugabyte_tablet_pgsql_web_port: &yugabyte_tablet_pgsql_web_port
        type: int
        default: 13000
        description:
          - "Sets the tablet YSQL web UI port."
      yugabyte_tablet_cql_bind_port: &yugabyte_tablet_cql_bind_port
        type: int
        default: 9042
        description:
          - "Sets the tablet YCQL bind port."
      yugabyte_tablet_cql_web_port: &yugabyte_tablet_cql_web_port
        type: int
        default: 12000
        description:
          - "Sets the tablet YCQL web UI port."
      yugabyte_k8s_resource_name: &yugabyte_k8s_resource_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - "Names the Kubernetes resources associated with the current host, including the derived NodePort Service when enabled."
      yugabyte_k8s_part_of: &yugabyte_k8s_part_of
        type: str
        default: yugabyte
        description:
          - "Value for the Kubernetes C(app.kubernetes.io/part-of) label applied to YugabyteDB resources."
      yugabyte_k8s_wait: &yugabyte_k8s_wait
        type: bool
        default: true
        description:
          - "Waits for YugabyteDB Kubernetes resources to become ready."
      yugabyte_k8s_wait_timeout: &yugabyte_k8s_wait_timeout
        type: int
        default: 300
        description:
          - "Sets the Kubernetes readiness wait timeout in seconds."
      yugabyte_k8s_master_rpc_node_port: &yugabyte_k8s_master_rpc_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external master RPC Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32100)."
      yugabyte_k8s_loadbalancer_expose_master_rpc_port:
        &yugabyte_k8s_loadbalancer_expose_master_rpc_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the master RPC port externally.
          - When undefined or C(false), the master RPC port is not included in the LoadBalancer Service.
      yugabyte_k8s_master_webserver_node_port:
        &yugabyte_k8s_master_webserver_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external master webserver Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32000)."
      yugabyte_k8s_loadbalancer_expose_master_webserver_port:
        &yugabyte_k8s_loadbalancer_expose_master_webserver_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the master webserver port externally.
          - When undefined or C(false), the master webserver port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_pgsql_node_port: &yugabyte_k8s_tablet_pgsql_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet YSQL Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(31433)."
      yugabyte_k8s_loadbalancer_expose_tablet_pgsql_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_pgsql_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YSQL port externally.
          - When undefined or C(false), the tablet YSQL port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_rpc_node_port: &yugabyte_k8s_tablet_rpc_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet RPC Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32101)."
      yugabyte_k8s_loadbalancer_expose_tablet_rpc_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_rpc_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet RPC port externally.
          - When undefined or C(false), the tablet RPC port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_webserver_node_port:
        &yugabyte_k8s_tablet_webserver_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet webserver Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32001)."
      yugabyte_k8s_loadbalancer_expose_tablet_webserver_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_webserver_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet webserver port externally.
          - When undefined or C(false), the tablet webserver port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_pgsql_web_node_port:
        &yugabyte_k8s_tablet_pgsql_web_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet YSQL web UI Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32300)."
      yugabyte_k8s_loadbalancer_expose_tablet_pgsql_web_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_pgsql_web_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YSQL web UI port externally.
          - When undefined or C(false), the tablet YSQL web UI port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_cql_bind_node_port:
        &yugabyte_k8s_tablet_cql_bind_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet YCQL bind Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32042)."
      yugabyte_k8s_loadbalancer_expose_tablet_cql_bind_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_cql_bind_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YCQL bind port externally.
          - When undefined or C(false), the tablet YCQL bind port is not included in the LoadBalancer Service.
      yugabyte_k8s_tablet_cql_web_node_port:
        &yugabyte_k8s_tablet_cql_web_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external tablet YCQL web UI Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(32200)."
      yugabyte_k8s_loadbalancer_expose_tablet_cql_web_port:
        &yugabyte_k8s_loadbalancer_expose_tablet_cql_web_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the tablet YCQL web UI port externally.
          - When undefined or C(false), the tablet YCQL web UI port is not included in the LoadBalancer Service.
      fetched_artifacts_dir: &fetched_artifacts_dir
        type: path
        description:
          - "Defines the control-node directory that stores fetched YugabyteDB artifacts."
          - "Required when TLS-enabled tasks need access to fetched CA or certificate artifacts, such as when C(yugabyte_use_tls) or webserver TLS is enabled."
          - "Example: C(/tmp/fabric-x/artifacts/yugabyte)."
      cryptogen_artifacts_dir: &cryptogen_artifacts_dir
        type: path
        required: true
        description:
          - "Defines the control-node directory that stores cryptogen-generated artifacts."
          - "Example: C(/tmp/fabric-x/crypto-config)."
      actual_host: &actual_host
        type: str
        required: true
        description:
          - Real machine host.
          - "Example: C(myvpc.cloud.ibm.com)."
      organization: &organization
        type: dict
        description:
          - "Provides the organization metadata consumed by the crypto entry points."
          - "The mapping is expected to expose C(domain), C(role), C(peer.name), C(peer.secret), and C(fabric_ca_host) when relevant."
          - "Example: C({'domain': 'org1.example.com', 'role': 'peer', 'peer': {'name': 'yb-tserver-1', 'secret': 'yb-tserver-1PWD'}, 'fabric_ca_host': 'fca-org1'})."
      yugabyte_db: &yugabyte_db
        type: str
        required: true
        description:
          - "Sets the YugabyteDB database name created by the initialization SQL script."
          - "Example: C(fabricx)."
      yugabyte_user: &yugabyte_user
        type: str
        required: true
        description:
          - "Sets the YugabyteDB database user created by the initialization SQL script."
          - "Example: C(fabricx_user)."
      yugabyte_password: &yugabyte_password
        type: str
        required: true
        description:
          - "Sets the password for the YugabyteDB database user."
          - "Store this value in Ansible Vault."
          - "Example: C(my_yugabyte_password)."
      k8s_namespace: &k8s_namespace
        type: str
        description:
          - "Sets the Kubernetes namespace used by YugabyteDB resources."
          - "Example: C(fabricx-yugabyte)."
      k8s_storage_size: &k8s_storage_size
        type: str
        required: true
        description:
          - "Sets the requested persistent storage size for Kubernetes deployments."
          - "Example: C(20Gi)."
      k8s_storage_class: &k8s_storage_class
        type: str
        description:
          - "Sets the storage class used by Kubernetes PersistentVolumeClaims when defined."
          - "Example: C(fast-ssd)."
      k8s_image_pull_secret: &k8s_image_pull_secret
        type: str
        description:
          - "Sets the image pull secret used by Kubernetes deployments when defined."
          - "Example: C(registry-pull-secret)."
      k8s_readiness_probe_initial_delay_seconds:
        &k8s_readiness_probe_initial_delay_seconds
        type: int
        description:
          - "Overrides the readiness probe initial delay used by Kubernetes templates when defined."
          - "Example: C(30)."
      k8s_readiness_probe_period_seconds: &k8s_readiness_probe_period_seconds
        type: int
        description:
          - "Overrides the readiness probe period used by Kubernetes templates when defined."
          - "Example: C(10)."
      k8s_readiness_probe_timeout_seconds: &k8s_readiness_probe_timeout_seconds
        type: int
        description:
          - "Overrides the readiness probe timeout used by Kubernetes templates when defined."
          - "Example: C(5)."
      k8s_readiness_probe_failure_threshold:
        &k8s_readiness_probe_failure_threshold
        type: int
        description:
          - "Overrides the readiness probe failure threshold used by Kubernetes templates when defined."
          - "Example: C(12)."
      k8s_liveness_probe_initial_delay_seconds:
        &k8s_liveness_probe_initial_delay_seconds
        type: int
        description:
          - "Overrides the liveness probe initial delay used by Kubernetes templates when defined."
          - "Example: C(60)."
      k8s_liveness_probe_period_seconds: &k8s_liveness_probe_period_seconds
        type: int
        description:
          - "Overrides the liveness probe period used by Kubernetes templates when defined."
          - "Example: C(20)."
      k8s_liveness_probe_timeout_seconds: &k8s_liveness_probe_timeout_seconds
        type: int
        description:
          - "Overrides the liveness probe timeout used by Kubernetes templates when defined."
          - "Example: C(5)."
      k8s_liveness_probe_failure_threshold:
        &k8s_liveness_probe_failure_threshold
        type: int
        description:
          - "Overrides the liveness probe failure threshold used by Kubernetes templates when defined."
          - "Example: C(6)."
      k8s_resources: &k8s_resources
        type: dict
        description:
          - Optional Kubernetes container resource requests and limits.
          - "Example: C({'requests': {'memory': '1Gi', 'cpu': '500m'}, 'limits': {'memory': '2Gi', 'cpu': '1000m'}})."

      yugabyte_use_openshift: &yugabyte_use_openshift
        type: bool
        default: false
        description:
          - Selects the OpenShift deployment branch.
      yugabyte_openshift_master_webserver_route:
        &yugabyte_openshift_master_webserver_route
        type: str
        description:
          - Specifies the OpenShift Route host.
          - "Example: C(yugabyte-master-web.apps.example.com)."
      yugabyte_openshift_tablet_webserver_route:
        &yugabyte_openshift_tablet_webserver_route
        type: str
        description:
          - Specifies the OpenShift Route host.
          - "Example: C(yugabyte-tablet-web.apps.example.com)."
      yugabyte_openshift_tablet_pgsql_web_route:
        &yugabyte_openshift_tablet_pgsql_web_route
        type: str
        description:
          - Specifies the OpenShift Route host.
          - "Example: C(yugabyte-tablet-pgsql-web.apps.example.com)."
      yugabyte_openshift_tablet_cql_web_route:
        &yugabyte_openshift_tablet_cql_web_route
        type: str
        description:
          - Specifies the OpenShift Route host.
          - "Example: C(yugabyte-tablet-cql-web.apps.example.com)."
  start:
    short_description: Start a YugabyteDB cluster
    description:
      - "Builds master and tablet topology facts from C(yugabyte_cluster), derives the master RPC endpoint list, and dispatches each host to the container or Kubernetes startup path."
      - "Master hosts run C(yb-master) with a replication factor based on the master host list; tablet hosts run C(yb-tserver) and the first tablet initializes the configured database."
    options:
      yugabyte_cluster: *yugabyte_cluster
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_use_container: *yugabyte_use_container
      yugabyte_use_bin: *yugabyte_use_bin

  stop:
    short_description: Stop YugabyteDB runtime
    description:
      - "Stops the YugabyteDB runtime for container deployments."
      - "Kubernetes mode is managed through the removal entry points because StatefulSets and Services are reconciled resources."
    options:
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_use_container: *yugabyte_use_container
      yugabyte_use_bin: *yugabyte_use_bin

  teardown:
    short_description: Remove YugabyteDB runtime artifacts
    description:
      - "Removes the active YugabyteDB runtime in the selected deployment mode and then removes persisted role-managed data."
      - "Container mode deletes the running container and host data directory; Kubernetes mode deletes StatefulSets, Services, optional NodePort Services, and PVCs."
      - "Binary mode stops the process and deletes its data directories, but keeps the unpacked
        release so that a redeploy does not download and unpack it again, in the same way that
        container mode keeps the image."
    options:
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_use_container: *yugabyte_use_container
      yugabyte_use_bin: *yugabyte_use_bin

  wipe:
    short_description: Wipe YugabyteDB state
    description:
      - "Runs teardown, removes persisted data, and deletes role-managed TLS and initialization configuration artifacts."
      - "Use this entry point when the YugabyteDB node should be returned to a clean state before regeneration."
    options: {}

  fetch_logs:
    short_description: Collect YugabyteDB logs
    description:
      - "Collects YugabyteDB logs through the selected deployment mode."
      - "Container mode fetches logs from the named container; Kubernetes mode fetches pod logs selected by the resource labels; binary mode fetches the tmux session's log file."
    options:
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_use_container: *yugabyte_use_container
      yugabyte_use_bin: *yugabyte_use_bin

  ping:
    short_description: Check YugabyteDB service ports
    description:
      - "Selects the expected master or tablet service ports for the current host and delegates reachability checks."
      - "Masters expose RPC and webserver ports; tablets expose YSQL, RPC, webserver, YSQL web UI, YCQL, and YCQL web UI ports."
    options:
      yugabyte_component_type: *yugabyte_component_type
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_master_webserver_port: *yugabyte_master_webserver_port
      yugabyte_master_rpc_bind_port: *yugabyte_master_rpc_bind_port
      yugabyte_tablet_pgsql_bind_port: *yugabyte_tablet_pgsql_bind_port
      yugabyte_tablet_rpc_bind_port: *yugabyte_tablet_rpc_bind_port
      yugabyte_tablet_webserver_port: *yugabyte_tablet_webserver_port
      yugabyte_tablet_pgsql_web_port: *yugabyte_tablet_pgsql_web_port
      yugabyte_tablet_cql_bind_port: *yugabyte_tablet_cql_bind_port
      yugabyte_tablet_cql_web_port: *yugabyte_tablet_cql_web_port

  k8s/ping:
    short_description: Check that the YugabyteDB Kubernetes service is reachable
    description:
      - Probes configured Kubernetes NodePort values and LoadBalancer-exposed service ports for external reachability.
    options:
      yugabyte_component_type: *yugabyte_component_type
      yugabyte_k8s_master_rpc_node_port: *yugabyte_k8s_master_rpc_node_port
      yugabyte_k8s_master_webserver_node_port: *yugabyte_k8s_master_webserver_node_port
      yugabyte_k8s_tablet_pgsql_node_port: *yugabyte_k8s_tablet_pgsql_node_port
      yugabyte_k8s_tablet_rpc_node_port: *yugabyte_k8s_tablet_rpc_node_port
      yugabyte_k8s_tablet_webserver_node_port: *yugabyte_k8s_tablet_webserver_node_port
      yugabyte_k8s_tablet_pgsql_web_node_port: *yugabyte_k8s_tablet_pgsql_web_node_port
      yugabyte_k8s_tablet_cql_bind_node_port: *yugabyte_k8s_tablet_cql_bind_node_port
      yugabyte_k8s_tablet_cql_web_node_port: *yugabyte_k8s_tablet_cql_web_node_port
      yugabyte_k8s_loadbalancer_expose_master_rpc_port: *yugabyte_k8s_loadbalancer_expose_master_rpc_port
      yugabyte_k8s_loadbalancer_expose_master_webserver_port: *yugabyte_k8s_loadbalancer_expose_master_webserver_port
      yugabyte_k8s_loadbalancer_expose_tablet_pgsql_port: *yugabyte_k8s_loadbalancer_expose_tablet_pgsql_port
      yugabyte_k8s_loadbalancer_expose_tablet_rpc_port: *yugabyte_k8s_loadbalancer_expose_tablet_rpc_port
      yugabyte_k8s_loadbalancer_expose_tablet_webserver_port: *yugabyte_k8s_loadbalancer_expose_tablet_webserver_port
      yugabyte_k8s_loadbalancer_expose_tablet_pgsql_web_port: *yugabyte_k8s_loadbalancer_expose_tablet_pgsql_web_port
      yugabyte_k8s_loadbalancer_expose_tablet_cql_bind_port: *yugabyte_k8s_loadbalancer_expose_tablet_cql_bind_port
      yugabyte_k8s_loadbalancer_expose_tablet_cql_web_port: *yugabyte_k8s_loadbalancer_expose_tablet_cql_web_port
      yugabyte_master_rpc_bind_port: *yugabyte_master_rpc_bind_port
      yugabyte_master_webserver_port: *yugabyte_master_webserver_port
      yugabyte_tablet_pgsql_bind_port: *yugabyte_tablet_pgsql_bind_port
      yugabyte_tablet_rpc_bind_port: *yugabyte_tablet_rpc_bind_port
      yugabyte_tablet_webserver_port: *yugabyte_tablet_webserver_port
      yugabyte_tablet_pgsql_web_port: *yugabyte_tablet_pgsql_web_port
      yugabyte_tablet_cql_bind_port: *yugabyte_tablet_cql_bind_port
      yugabyte_tablet_cql_web_port: *yugabyte_tablet_cql_web_port

  crypto/setup:
    short_description: Prepare YugabyteDB TLS assets
    description:
      - "Prepares TLS assets for YugabyteDB when TLS is enabled, using the configured crypto source."
      - "The flow can generate CSRs, fetch certificates, transfer cryptogen material, enroll through Fabric CA, and create the Kubernetes Secret used by pods."
    options:
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      organization: *organization

  crypto/fetch:
    short_description: Fetch YugabyteDB TLS certificates
    description:
      - "Copies generated YugabyteDB node and CA certificates from the remote host to the control-node artifact directory."
      - "Fetched artifacts are reused by certificate transfer, Kubernetes Secret generation, and TLS-enabled Prometheus scraper configuration."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      fetched_artifacts_dir: *fetched_artifacts_dir

  crypto/rm:
    short_description: Remove YugabyteDB TLS artifacts
    description:
      - "Deletes the remote YugabyteDB TLS directory and, in Kubernetes mode, removes the generated TLS Secret."
      - "This removes role-managed key, certificate, and CA material without changing database data."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      yugabyte_k8s_resource_name: *yugabyte_k8s_resource_name
      k8s_namespace: *k8s_namespace

  crypto/openssl/generate_csr:
    short_description: Generate a YugabyteDB TLS CSR
    description:
      - "Builds the YugabyteDB TLS SAN list from host addresses and organization metadata, then delegates CSR generation to the OpenSSL role."
      - "The generated key, CSR, and extension file are written under the remote YugabyteDB TLS configuration path."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      organization:
        <<: *organization
        required: true
      yugabyte_component_type: *yugabyte_component_type
      yugabyte_openshift_master_webserver_route: *yugabyte_openshift_master_webserver_route
      yugabyte_openshift_tablet_webserver_route: *yugabyte_openshift_tablet_webserver_route
      yugabyte_openshift_tablet_pgsql_web_route: *yugabyte_openshift_tablet_pgsql_web_route
      yugabyte_openshift_tablet_cql_web_route: *yugabyte_openshift_tablet_cql_web_route

  crypto/openssl/fetch_csr:
    short_description: Fetch a YugabyteDB TLS CSR
    description:
      - "Copies the YugabyteDB CSR and OpenSSL extension file from the remote TLS directory to the control-node artifact directory."
      - "Use this before signing the node certificate outside the target host."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      fetched_artifacts_dir: *fetched_artifacts_dir

  crypto/openssl/transfer_cert:
    short_description: Transfer a signed YugabyteDB TLS certificate
    description:
      - "Copies the signed YugabyteDB node certificate and trusted organization TLS CA certificate to the remote TLS directory."
      - "The transferred files are consumed by container volume mounts or by Kubernetes Secret generation."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      fetched_artifacts_dir: *fetched_artifacts_dir
      organization:
        <<: *organization
        required: true

  crypto/cryptogen/transfer:
    short_description: Copy cryptogen TLS material for YugabyteDB
    description:
      - "Transfers the YugabyteDB TLS key, certificate, and CA certificate generated by cryptogen to the target host."
      - "The source path is resolved from the organization domain and peer identity, with the inventory host used as the peer name when no peer name is provided."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      cryptogen_artifacts_dir: *cryptogen_artifacts_dir
      organization:
        <<: *organization
        required: true

  crypto/fabric_ca/enroll:
    short_description: Enroll YugabyteDB TLS material with Fabric CA
    description:
      - "Copies the Fabric CA TLS root when needed and delegates YugabyteDB TLS enrollment to the Fabric CA role."
      - "Enrollment uses organization metadata, peer credentials, and the actual external host so generated certificates include the expected SANs."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      fetched_artifacts_dir: *fetched_artifacts_dir
      actual_host: *actual_host
      organization:
        <<: *organization
        required: true
      yugabyte_component_type: *yugabyte_component_type
      yugabyte_openshift_master_webserver_route: *yugabyte_openshift_master_webserver_route
      yugabyte_openshift_tablet_webserver_route: *yugabyte_openshift_tablet_webserver_route
      yugabyte_openshift_tablet_pgsql_web_route: *yugabyte_openshift_tablet_pgsql_web_route
      yugabyte_openshift_tablet_cql_web_route: *yugabyte_openshift_tablet_cql_web_route
      yugabyte_tls_san_all_cluster_nodes: *yugabyte_tls_san_all_cluster_nodes
      yugabyte_cluster_id: *yugabyte_cluster_id

  config/transfer:
    short_description: Transfer YugabyteDB initialization config
    description:
      - "Renders the YugabyteDB initialization SQL script that creates the configured database user and database."
      - "Container mode places the script in the remote config directory; Kubernetes mode also creates the ConfigMap mounted by tablet pods."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      yugabyte_init_script_file: *yugabyte_init_script_file
      yugabyte_db: *yugabyte_db
      yugabyte_user: *yugabyte_user
      yugabyte_password: *yugabyte_password
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift

  config/rm:
    short_description: Remove YugabyteDB configuration
    description:
      - "Deletes the remote YugabyteDB configuration directory and, in Kubernetes mode, removes the generated initialization ConfigMap."
      - "This cleans role-managed config without removing running resources unless paired with teardown or wipe."
    options:
      remote_config_dir: *remote_config_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      yugabyte_use_k8s: *yugabyte_use_k8s
      yugabyte_use_openshift: *yugabyte_use_openshift
      yugabyte_k8s_resource_name: *yugabyte_k8s_resource_name
      k8s_namespace: *k8s_namespace

  config/transfer_grafana_dashboard:
    short_description: Transfer the YugabyteDB Grafana dashboard
    description:
      - "Selects the built-in YugabyteDB dashboard JSON file and delegates the copy step to the Grafana role."
      - "The dashboard complements the Prometheus scraper configuration generated by this role."
    options: {}

  container/start:
    short_description: Dispatch YugabyteDB container startup
    description:
      - "Selects the master or tablet container startup path for the current host."
      - "The selected path starts either C(yb-master) or C(yb-tserver) with the role-managed data, config, TLS, and port settings."
    options:
      yugabyte_component_type: *yugabyte_component_type

  container/stop:
    short_description: Stop a YugabyteDB container
    description:
      - "Stops the container associated with the current YugabyteDB host."
      - "This leaves host data and configuration directories in place for a later restart."
    options:
      yugabyte_container_name: *yugabyte_container_name

  container/rm:
    short_description: Remove a YugabyteDB container
    description:
      - "Deletes the container associated with the current YugabyteDB host."
      - "This removes the runtime container only; data cleanup is handled by C(data/rm) or C(teardown)."
    options:
      yugabyte_container_name: *yugabyte_container_name

  container/fetch_logs:
    short_description: Fetch logs from a YugabyteDB container
    description:
      - "Delegates log collection for the current YugabyteDB container."
      - "Collected logs come from the named master or tablet container for troubleshooting."
    options:
      yugabyte_container_name: *yugabyte_container_name

  container/master/start:
    short_description: Start a YugabyteDB master container
    description:
      - "Creates the host data directory, assembles the C(yb-master) command line, and starts the master container."
      - "The container publishes master RPC and webserver ports, mounts the data directory, and mounts TLS material when TLS is enabled."
    options:
      remote_data_dir: *remote_data_dir
      remote_config_dir: *remote_config_dir
      yugabyte_remote_data_dir: *yugabyte_remote_data_dir
      yugabyte_container_data_dir: *yugabyte_container_data_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      yugabyte_container_name: *yugabyte_container_name
      yugabyte_registry_endpoint: *yugabyte_registry_endpoint
      yugabyte_image_name: *yugabyte_image_name
      yugabyte_image_tag: *yugabyte_image_tag
      yugabyte_image: *yugabyte_image
      yugabyte_master_endpoints: *yugabyte_master_endpoints
      yugabyte_master_rpc_bind_port: *yugabyte_master_rpc_bind_port
      yugabyte_master_webserver_port: *yugabyte_master_webserver_port
      yugabyte_master_hosts: *yugabyte_master_hosts
      yugabyte_logs_level: *yugabyte_logs_level
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_node_to_node_use_tls: *yugabyte_node_to_node_use_tls
      yugabyte_client_to_server_use_tls: *yugabyte_client_to_server_use_tls
      yugabyte_webserver_use_tls: *yugabyte_webserver_use_tls

  container/tablet/start:
    short_description: Start a YugabyteDB tablet container
    description:
      - "Creates the host data directory, assembles the C(yb-tserver) command line, starts the tablet container, and initializes the database on the first tablet host."
      - "The container publishes YSQL, RPC, webserver, and YCQL ports, mounts initialization config, and mounts TLS material when TLS is enabled."
    options:
      remote_data_dir: *remote_data_dir
      remote_config_dir: *remote_config_dir
      yugabyte_remote_data_dir: *yugabyte_remote_data_dir
      yugabyte_remote_config_dir: *yugabyte_remote_config_dir
      yugabyte_container_data_dir: *yugabyte_container_data_dir
      yugabyte_init_script_file: *yugabyte_init_script_file
      yugabyte_container_name: *yugabyte_container_name
      yugabyte_registry_endpoint: *yugabyte_registry_endpoint
      yugabyte_image_name: *yugabyte_image_name
      yugabyte_image_tag: *yugabyte_image_tag
      yugabyte_image: *yugabyte_image
      yugabyte_master_endpoints: *yugabyte_master_endpoints
      yugabyte_tablet_pgsql_bind_port: *yugabyte_tablet_pgsql_bind_port
      yugabyte_tablet_rpc_bind_port: *yugabyte_tablet_rpc_bind_port
      yugabyte_tablet_webserver_port: *yugabyte_tablet_webserver_port
      yugabyte_tablet_pgsql_web_port: *yugabyte_tablet_pgsql_web_port
      yugabyte_tablet_cql_bind_port: *yugabyte_tablet_cql_bind_port
      yugabyte_tablet_cql_web_port: *yugabyte_tablet_cql_web_port
      yugabyte_tablet_hosts: *yugabyte_tablet_hosts
      yugabyte_logs_level: *yugabyte_logs_level
      yugabyte_use_tls: *yugabyte_use_tls
      yugabyte_node_to_node_use_tls: *yugabyte_node_to_node_use_tls
      yugabyte_client_to_server_use_tls: *yugabyte_client_to_server_use_tls
      yugabyte_webserver_use_tls: *yugabyte_webserver_use_tls

  k8s/start:
    short_description: Dispatch YugabyteDB Kubernetes startup
    description:
      - "Selects the master or tablet Kubernetes startup path for the current host."
      - "The selected path applies the Service, optional NodePort Service, StatefulSet, PVC template, image pull secret reference, and probe settings for the node type."
    options:
      yugabyte_component_type: *yugabyte_component_type

  k8s/rm:
    short_description: Dispatch YugabyteDB Kubernetes removal
    description:
      - "Selects the master or tablet Kubernetes removal path for the current host."
      - "The selected path removes the StatefulSet, ClusterIP Service, and optional NodePort Service for the node type."
    options:
      yugabyte_component_type: *yugabyte_component_type

  k8s/fetch_logs:
    short_description: Fetch logs from YugabyteDB pods
    description:
      - "Delegates pod log collection for the Kubernetes resource associated with the current host."
      - "Pods are selected by the role-managed Kubernetes resource label for the master or tablet StatefulSet."
    options:
      yugabyte_k8s_resource_name: *yugabyte_k8s_resource_name

