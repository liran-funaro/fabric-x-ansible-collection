# =========================
# Loadgen
# =========================
- name: Transfer the Hyperledger Fabric-X Loadgen config files
  vars:
    committer_sidecar_host: >-
      {{
        committer_hosts
        | map('extract', hostvars)
        | selectattr('committer_component_type', 'defined')
        | selectattr('committer_component_type', '==', 'sidecar')
        | map(attribute='inventory_hostname')
        | list
        | first
      }}
    committer_query_service_hosts: >-
      {{
        committer_hosts
        | map('extract', hostvars)
        | selectattr('committer_component_type', 'defined')
        | selectattr('committer_component_type', '==', 'query-service')
        | map(attribute='inventory_hostname')
        | list
      }}
    # Empty with the embedded mock orderer, where no ordering service is deployed. The
    # rendered config only dereferences this host in the real-orderer branch.
    orderer_ref_host: >-
      {{
        orderer_hosts
        | default([])
        | map('extract', hostvars)
        | selectattr('orderer_component_type', '==', 'router')
        | map(attribute='inventory_hostname')
        | list
        | first
      }}
  block:
    - name: Ensure the Hyperledger Fabric-X Loadgen config directory exists
      ansible.builtin.file:
        path: "{{ loadgen_remote_config_dir }}"
        state: directory
        mode: "0o755"
    - name: Generate the config for the Hyperledger Fabric-X Loadgen
      ansible.builtin.template:
        src: "loadgen.yaml.j2"
        dest: "{{ loadgen_remote_config_dir }}/{{ loadgen_config_file }}"
        mode: "0o644"
    # =========================
    # Genesis config block
    # =========================
    # Not needed with the embedded mock orderer: the loadgen reads the config block from its
    # own artifacts directory, where `loadgen make-artifacts` generated it, and the orderer
    # client that consumes this copy is not configured in that mode.
    - name: Copy genesis config block for Fabric-X Loadgen
      ansible.builtin.copy:
        src: "{{ genesis_config_block_path }}"
        dest: "{{ loadgen_remote_config_dir }}/{{ loadgen_config_block_file }}"
        mode: "0o644"
      when:
        - not loadgen_use_mock_orderer
    # =========================
    # HLFX Committer Sidecar TLS
    # =========================
    - name: Transfer Hyperledger Fabric-X Committer Sidecar TLS CA certificate
      when:
        - hostvars[committer_sidecar_host].committer_use_tls is defined
        - hostvars[committer_sidecar_host].committer_use_tls
      block:
        - name: Ensure Hyperledger Fabric-X Committer Sidecar TLS folder exist
          ansible.builtin.file:
            path: "{{ loadgen_remote_config_dir }}/tls/sidecar"
            state: directory
            mode: "0o755"
        - name: Transfer Hyperledger Fabric-X Committer Sidecar TLS CA certificate
          ansible.builtin.copy:
            src: "{{ fetched_artifacts_dir }}/{{ committer_sidecar_host }}/tls/ca.crt"
            dest: "{{ loadgen_remote_config_dir }}/tls/sidecar/ca.crt"
            mode: "0o644"
    # =========================
    # HLFX Committer Coordinator TLS
    # =========================
    # Only needed when applying load straight to the coordinator, which takes the sidecar
    # out of the path so that the coordinator's own ceiling can be measured.
    - name: Transfer Hyperledger Fabric-X Committer Coordinator TLS CA certificate
      when:
        - loadgen_coordinator_host is defined
        - hostvars[loadgen_coordinator_host].committer_use_tls is defined
        - hostvars[loadgen_coordinator_host].committer_use_tls
      block:
        - name: Ensure Hyperledger Fabric-X Committer Coordinator TLS folder exist
          ansible.builtin.file:
            path: "{{ loadgen_remote_config_dir }}/tls/coordinator"
            state: directory
            mode: "0o755"
        - name: Transfer Hyperledger Fabric-X Committer Coordinator TLS CA certificate
          ansible.builtin.copy:
            src: "{{ fetched_artifacts_dir }}/{{ loadgen_coordinator_host }}/tls/ca.crt"
            dest: "{{ loadgen_remote_config_dir }}/tls/coordinator/ca.crt"
            mode: "0o644"
    # =========================
    # HLFX Committer Query Service TLS
    # =========================
    # Only needed when the loadgen queries committed read versions (queries-rate > 0).
    - name: Transfer Hyperledger Fabric-X Committer Query Service TLS CA certificate
      when:
        - loadgen_queries_rate is defined
        - (loadgen_queries_rate | float) > 0
        - committer_query_service_hosts | length > 0
        - hostvars[committer_query_service_hosts | first].committer_use_tls is defined
        - hostvars[committer_query_service_hosts | first].committer_use_tls
      block:
        - name: Ensure Hyperledger Fabric-X Committer Query Service TLS folder exists
          ansible.builtin.file:
            path: "{{ loadgen_remote_config_dir }}/tls/query"
            state: directory
            mode: "0o755"
        - name: Transfer Hyperledger Fabric-X Committer Query Service TLS CA certificate
          ansible.builtin.copy:
            src: "{{ fetched_artifacts_dir }}/{{ committer_query_service_hosts | first }}/tls/ca.crt"
            dest: "{{ loadgen_remote_config_dir }}/tls/query/ca.crt"
            mode: "0o644"
    # =========================
    # mTLS
    # =========================
    - name: Transfer Monitoring mTLS certificates
      ansible.builtin.include_role:
        name: hyperledger.fabricx.loadgen
        tasks_from: config/mtls/monitoring/transfer
      when:
        - loadgen_monitoring_use_mtls
    # =========================
    # Kubernetes ConfigMap
    # =========================
    - name: Transfer Fabric-X Loadgen Kubernetes ConfigMap
      ansible.builtin.include_role:
        name: hyperledger.fabricx.loadgen
        tasks_from: k8s/config/transfer
      when: loadgen_use_k8s or loadgen_use_openshift
