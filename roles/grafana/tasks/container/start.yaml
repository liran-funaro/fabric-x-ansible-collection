- name: Set Grafana container environment variables
  ansible.builtin.set_fact:
    grafana_env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_username }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_password }}"
      GF_SERVER_HTTP_PORT: "{{ grafana_web_port | string }}"
      GF_SERVER_HTTP_ADDR: "{{ grafana_bind_address }}"

- name: Set Grafana environment variables for TLS
  vars:
    grafana_tls_env:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_KEY: "{{ grafana_container_config_dir }}/tls/{{ grafana_tls_private_key_file }}"
      GF_SERVER_CERT_FILE: "{{ grafana_container_config_dir }}/tls/{{ grafana_tls_cert_file }}"
  ansible.builtin.set_fact:
    grafana_env: "{{ grafana_env | combine(grafana_tls_env) }}"
  when:
    - grafana_use_tls

- name: Start Grafana container
  vars:
    container_name: "{{ grafana_container_name }}"
    container_image: "{{ grafana_image }}"
    container_env: "{{ grafana_env }}"
    container_ports:
      - "{{ grafana_web_port }}:{{ grafana_web_port }}"
    container_volumes:
      - "{{ grafana_remote_config_dir }}:{{ grafana_container_config_dir }}:z,ro"
    # Probe the address Grafana is actually listening on. grafana_bind_address may narrow it
    # to loopback, and then nothing answers on ansible_host, so a healthcheck aimed there
    # reports unhealthy for a Grafana that is serving perfectly well. Under TLS the URL still
    # has to name the host the certificate was issued for, so --resolve redirects the
    # connection to the bind address while leaving verification of that name intact, rather
    # than reaching for --insecure and giving up on checking TLS at all.
    container_healthcheck_test: >-
      curl -f
      --silent
      --show-error
      {% if grafana_use_tls %}
      --cacert {{ grafana_container_config_dir }}/tls/{{ grafana_tls_cert_file }}
      {% if grafana_bind_address not in ['0.0.0.0', '::', ''] %}
      --resolve {{ ansible_host }}:{{ grafana_web_port }}:{{ grafana_bind_address }}
      {% endif %}
      https://{{ ansible_host }}:{{ grafana_web_port }}/api/health
      {% else %}
      http://{{ grafana_bind_address if grafana_bind_address not in ['0.0.0.0', '::', ''] else 'localhost' }}:{{ grafana_web_port }}/api/health
      {% endif %}
    container_wait_until_running: true
    container_run_as_host_user: true
    container_wait_port: "{{ grafana_web_port }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
