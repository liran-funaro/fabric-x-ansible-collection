- name: Transfer the fxconfig configuration files
  hosts: "{{ target_hosts | default('all') }}"
  tasks:
    - name: Define configuration files for fxconfig
      vars:
        reference_committer_hosts: >-
          {{
            (
              groups['fabric_x_committers']
              | default([])
              | map('extract', hostvars)
              | selectattr('organization', 'defined')
              | selectattr('organization.domain', 'defined')
              | selectattr('organization.domain', '==', organization.domain)
              | map(attribute='inventory_hostname')
              | sort
              | list
            )
            or groups['fabric_x_committers'] | default([])
          }}
      when:
        - organization is defined
        - organization.namespaces is defined
        - organization.users is defined
        # fxconfig submits its namespace envelopes through an orderer router, and with the mock
        # orderer embedded in the load generator there is none to address. The load generator
        # creates the namespaces itself over its own mock orderer instead.
        - not (use_mock_orderer | default(false))
      block:
        - name: Get the endorser user
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: get_endorser
        - name: Transfer the configuration files for fxconfig on nodes declaring namespaces
          vars:
            fxconfig_msp_config_path: "{{ remote_config_dir }}/users/{{ fxconfig_endorser_user.name }}@{{ organization.domain }}/msp"
            orderer_router_host: >-
              {{
                groups['all']
                | map('extract', hostvars)
                | selectattr('orderer_component_type', 'defined')
                | selectattr('orderer_component_type', '==', 'router')
                | map(attribute='inventory_hostname')
                | sort
                | first
              }}
            # Empty when no query service is deployed, which is a supported topology: the
            # committer runs without one, and fxconfig only needs it to answer queries, not to
            # submit the namespace envelopes this playbook is here for. `first` raises on an
            # empty sequence, so the selection is kept as a list and reduced conditionally --
            # everything downstream guards on this being non-empty.
            committer_query_service_hosts: >-
              {{
                reference_committer_hosts
                | map('extract', hostvars)
                | selectattr('committer_component_type', 'defined')
                | selectattr('committer_component_type', '==', 'query-service')
                | map(attribute='inventory_hostname')
                | sort
                | list
              }}
            committer_query_service_host: >-
              {{ committer_query_service_hosts | first if committer_query_service_hosts else '' }}
            committer_sidecar_host: >-
              {{
                reference_committer_hosts
                | map('extract', hostvars)
                | selectattr('committer_component_type', 'defined')
                | selectattr('committer_component_type', '==', 'sidecar')
                | map(attribute='inventory_hostname')
                | sort
                | list
                | first
              }}
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: config/transfer
