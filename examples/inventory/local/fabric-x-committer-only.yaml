# This inventory runs the Hyperledger Fabric-X Committer without an ordering service, to
# measure the committer in isolation.
#
# The load generator embeds a mock orderer: it cuts the blocks itself and serves them to the
# committer sidecar over the Atomic Broadcast API, so the pipeline under test is
#
#   loadgen (mock orderer) -> sidecar -> coordinator -> verifier -> validator-committer -> YugabyteDB
#
# and nothing that limits throughput belongs to the orderer. The load generator also
# generates the crypto material and the genesis config block ('loadgen make-artifacts'),
# because the mock orderer signs the blocks it serves and the sidecar has to verify them
# against the matching config block. Compared with a full deployment this drops the four
# orderer organizations, their Fabric CAs, and sixteen orderer processes, which is most of
# the setup time.
#
# Only the peer organization keeps a Fabric CA, which issues the TLS and MSP material the
# committer components and the load generator use to authenticate to each other.

all:
  vars:
    # =========================
    # Topology
    # =========================
    # Replace the ordering service with a mock orderer embedded in the load generator.
    # Set here rather than in group_vars, which is shared by every inventory.
    use_mock_orderer: true

    # =========================
    # Organizations
    # =========================
    organizations:
      org1: &Org1
        name: Org1
        domain: org1.example.com

    # =========================
    # Binary flags
    # =========================
    # Everything runs as a host binary, so "tmux" has to be installed on the targets.
    # Neither Armageddon nor configtxgen appears here: both build a config block out of the
    # orderer topology, and the load generator generates it instead.
    cryptogen_use_bin: true
    fxconfig_use_bin: true
    fabric_ca_client_use_bin: true
    # Use this one to speed up operations since 1-host only deployment.
    bin_build_on_control_node: true
  children:
    # =========================
    # Network (HLFX)
    # =========================
    network:
      children:
        # =========================
        # Hyperledger Fabric CAs
        # =========================
        fabric_cas:
          children:
            # =========================
            # Hyperledger Fabric CA DBs
            # =========================
            fabric_ca_dbs:
              vars:
                postgres_user: postgres
                postgres_password: example
                postgres_use_tls: true
              hosts:
                fca-org1-db:
                  postgres_db: Org1DB
                  postgres_port: 9170
            # =========================
            # Hyperledger Fabric CA Servers
            # =========================
            fabric_ca_servers:
              vars:
                fabric_ca_use_tls: true
                fabric_ca_name: "{{ inventory_hostname }}"
                fabric_ca_admin:
                  name: admin
                  secret: adminPWD
                  attrs:
                    hf.Registrar.Roles: "*"
                    hf.Registrar.Attributes: "*"
                    hf.GenCRL: "true"
                    hf.Revoker: "true"
              hosts:
                fca-org1:
                  fabric_ca_port: 9069
                  fabric_ca_operations_port: 9070
                  organization: *Org1
                  postgres_db_host: fca-org1-db

        # =========================
        # Hyperledger Fabric-X
        # =========================
        fabric_x:
          children:
            # =========================
            # HLFX Committer
            # =========================
            fabric_x_committers:
              children:
                fabric_x_committer:
                  vars:
                    # Run the committer components as host binaries instead of containers.
                    committer_use_bin: true
                    committer_use_tls: true
                    committer_use_mtls: true
                    committer_monitoring_mtls_clients:
                      - prometheus
                    organization:
                      <<: *Org1
                      fabric_ca_host: fca-org1
                      role: peer
                      peer:
                        name: "{{ inventory_hostname }}"
                        secret: "{{ inventory_hostname }}PWD"
                  children:
                    committer_dbs:
                      vars:
                        yugabyte_user: yugabyte
                        yugabyte_password: yugabyte
                        yugabyte_db: yugabyte
                        yugabyte_cluster_id: 1
                        yugabyte_use_tls: true
                      hosts:
                        yugabytedb-master-1:
                          yugabyte_component_type: master
                          yugabyte_master_rpc_bind_port: 5300
                          yugabyte_master_webserver_port: 5310
                        yugabytedb-tablet-1:
                          yugabyte_component_type: tablet
                          yugabyte_tablet_pgsql_bind_port: 5320
                          yugabyte_tablet_rpc_bind_port: 5330
                          yugabyte_tablet_webserver_port: 5340
                          yugabyte_tablet_cql_web_port: 5360
                          yugabyte_tablet_pgsql_web_port: 5370
                          yugabyte_tablet_cql_bind_port: 5380
                  hosts:
                    committer-validator:
                      yugabyte_cluster_ref_id: 1
                      committer_component_type: validator
                      committer_rpc_port: 5100
                      committer_metrics_port: 5200
                    committer-verifier:
                      committer_component_type: verifier
                      committer_rpc_port: 5110
                      committer_metrics_port: 5210
                    committer-coordinator:
                      committer_component_type: coordinator
                      committer_rpc_port: 5120
                      committer_metrics_port: 5220
                    committer-sidecar:
                      committer_component_type: sidecar
                      committer_rpc_port: 5130
                      committer_metrics_port: 5230

    # =========================
    # HLFX LoadGens
    # =========================
    load_generators:
      vars:
        # Run the loadgen as a host binary too, same as the committer. Both have to come from
        # the same revision: the mock orderer, the artifacts it generates, and the committer
        # all have to agree on the config block and the block signature format, so pin
        # 'loadgen_git_commit' and 'committer_git_commit' together when overriding them.
        loadgen_use_bin: true
        # Port the embedded mock orderer serves the Atomic Broadcast API on. Advertised in
        # the generated config block, so this is where the sidecar fetches blocks from.
        loadgen_mock_orderer_port: 7050
        # Create namespace 0 before applying load. 'make init' cannot do it here: fxconfig
        # would submit the namespace transactions through an ordering service, and the load
        # generator's mock orderer is the only one, so the load generator has to create them.
        loadgen_generate_namespace: true
        # Every transaction slot gets a fresh unique key, which is the default. There is no
        # key reuse, so no read-write conflicts, and every transaction should commit. This
        # measures the pipeline's ceiling rather than its conflict behaviour, at the cost of
        # a state database and a ledger that grow with every transaction.
        #
        # Set loadgen_key_backref_rate (with loadgen_key_lookback_window) to introduce
        # commit-time contention, and loadgen_queries_rate to make reads carry committed
        # versions fetched from a query service, which this inventory does not deploy.
        #
        # Rate to start generating at. 'make limit-rate LIMIT=<tps>' changes it on a running
        # deployment, which is how a ramp is driven; 0 removes the limit altogether. Keep an
        # eye on free disk over a long run: with only fresh keys nothing is ever overwritten,
        # so the state database and the sidecar ledger both grow with every transaction.
        loadgen_limit_rate: 1000
        # Generation-side throughput settings. The role defaults are deliberately tiny to keep
        # functional tests cheap, and would cap generation well below what the committer can
        # take, making the load generator itself the bottleneck under measurement.
        loadgen_workers: 64
        loadgen_stream_batches: 100
        loadgen_stream_buffers_size: 100
      hosts:
        orderer-loadgen:
          organization:
            <<: *Org1
            fabric_ca_host: fca-org1
            role: peer
            peer:
              name: "{{ inventory_hostname }}"
              secret: "{{ inventory_hostname }}PWD"
            users:
              - name: orderer-loadgen
                secret: "{{ inventory_hostname }}PWD"
            namespaces:
              - id: 0
                policy: threshold
          loadgen_use_tls: true
          loadgen_metrics_port: 12010
          loadgen_rpc_port: 12020

    # =========================
    # Monitoring Infra
    # =========================
    monitoring:
      hosts:
        node-exporter:
          node_exporter_port: 9111
          node_exporter_use_tls: true
        cadvisor:
          cadvisor_port: 9400
        prometheus:
          prometheus_port: 9090
          prometheus_use_tls: true
          # Loopback only: this host is internet-facing. Reach it via an SSH tunnel.
          # Safe here because the only Prometheus client is Grafana on the same host.
          prometheus_bind_address: 127.0.0.1
        grafana:
          grafana_username: admin
          grafana_password: adminPWD
          grafana_web_port: 3000
          # Loopback only: Grafana also runs on the dev machine (see grafana-local/).
          # Leaving this reachable would expose the admin/adminPWD UI publicly.
          grafana_bind_address: 127.0.0.1
          prometheus_host: prometheus
          loki_host: loki
          grafana_use_tls: true
        loki:
          loki_port: 9200
          loki_grpc_port: 9201
          loki_use_tls: true
        alloy:
          alloy_port: 9300
          alloy_use_tls: true
          loki_host: loki
