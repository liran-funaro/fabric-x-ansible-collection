- name: Start PostgreSQL databases
  ansible.builtin.import_playbook: hyperledger.fabricx.postgres.start

- name: Start YugabyteDB clusters
  ansible.builtin.import_playbook: hyperledger.fabricx.yugabyte.start

- name: Start AWX
  ansible.builtin.import_playbook: hyperledger.fabricx.awx.start

- name: Configure AWX
  ansible.builtin.import_playbook: hyperledger.fabricx.awx.configure

- name: Start Fabric CA servers
  ansible.builtin.import_playbook: hyperledger.fabricx.fabric_ca_server.start

- name: Start Fabric-X Orderer
  ansible.builtin.import_playbook: hyperledger.fabricx.orderer.start

# Must run after the PostgreSQL/YugabyteDB plays above and before the committer starts: from
# #617 onwards the schema is no longer created implicitly at startup, and the validator cannot
# open its RPC port until it exists.
- name: Initialize the Hyperledger Fabric-X Committer state database
  ansible.builtin.import_playbook: hyperledger.fabricx.committer.db_init

- name: Start Hyperledger Fabric-X Committer
  ansible.builtin.import_playbook: hyperledger.fabricx.committer.start

- name: Start Hyperledger Fabric-X Block Explorer
  ansible.builtin.import_playbook: hyperledger.fabricx.block_explorer.start

- name: Start Monitoring
  ansible.builtin.import_playbook: hyperledger.fabricx.monitoring.start

- name: Start Loadgen
  ansible.builtin.import_playbook: hyperledger.fabricx.loadgen.start

- name: Start Semaphore UI
  ansible.builtin.import_playbook: hyperledger.fabricx.semaphore_ui.start
